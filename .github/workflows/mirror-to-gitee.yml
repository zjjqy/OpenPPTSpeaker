name: Mirror to Gitee

# 单向镜像：GitHub → Gitee。
#
# 设计前提：Gitee 侧是**只读副本**。若直接在 Gitee 上改代码，
# 下次同步会被强制覆盖（分支用 --prune 对齐，标签用 --prune --force 对齐）。
#
# 需要在 GitHub 侧配置：
#   Secret   GITEE_TOKEN  — Gitee 私人令牌，勾选 projects 权限（必配）
#   Variable GITEE_USER   — Gitee 用户名；与 GitHub 同名时不必配（默认取 zjjqy）
#   Variable GITEE_REPO   — Gitee 仓库路径；默认 open-pptspeaker
#
# 注意 Gitee 会把仓库名转成 kebab-case 路径：
# 仓库叫 OpenPPTSpeaker，但地址是 https://gitee.com/<user>/open-pptspeaker.git
#
# ⚠️ 本文件会随镜像出现在 Gitee 的公开仓库里，所以令牌只能走 ${{ secrets.* }}，
#    绝对不能写成明文 —— 否则等于把令牌公开发布到 Gitee。

on:
  push:
    branches: ['**']
    tags: ['**']
  # 定时兜底：GitHub Actions 运行器在海外，Gitee 对其偶发风控/超时，
  # 一次失败可在次日自动补齐
  schedule:
    - cron: '0 19 * * *' # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:

permissions:
  contents: read

# 串行执行，避免两次同步并发 push 互相打断
concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 镜像需要完整提交历史与标签
          fetch-tags: true

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ vars.GITEE_USER || 'zjjqy' }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'open-pptspeaker' }}
        run: |
          set -euo pipefail

          # 未配置令牌时温和跳过，避免首次提交就在仓库上留一个红叉；
          # 令牌配错或过期仍会在 push 阶段明确报错。
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::notice::未配置 secrets.GITEE_TOKEN，已跳过同步。配置后自动生效。"
            exit 0
          fi

          # 令牌放在 URL 中：GitHub Actions 会把 secret 值在日志里自动打码为 ***
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git"

          # 取全部远程分支与标签
          git fetch origin --force --tags "+refs/heads/*:refs/remotes/origin/*"

          # 把每个远程分支落成一个本地分支。
          # actions/checkout 只会创建被检出的那一个本地分支，而下面必须用
          # refs/heads/* 作推送源 —— 新版 git 把 refs/remotes/* 当推送源时
          # 通配 refspec 不再匹配（报 "No refs in common and none specified"）。
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            branch="${ref#origin/}"
            git show-ref --verify --quiet "refs/heads/${branch}" || git branch "${branch}" "${ref}"
          done < <(git for-each-ref --format='%(refname:short)' \
                     --exclude='refs/remotes/origin/HEAD' refs/remotes/origin)

          echo "---- 将同步的分支 ----"
          git for-each-ref --format='  %(refname:short)' refs/heads
          echo "---- 将同步的标签 ----"
          git tag -l | sed 's/^/  /'

          # 分支整体对齐：--prune 删除 Gitee 上多出来的分支，使其与 GitHub 严格一致
          git push --prune --force gitee "+refs/heads/*:refs/heads/*"

          # 标签整体对齐：--prune 删除已不存在的标签，--force 覆盖同名标签。
          # 通配 refspec 匹配不到任何标签时 git 会报错，故先判断有无标签。
          if [ -n "$(git tag -l)" ]; then
            git push --prune --force gitee "+refs/tags/*:refs/tags/*"
          else
            echo "本地没有任何标签，跳过标签同步"
          fi

          echo "✅ 已同步到 https://gitee.com/${GITEE_USER}/${GITEE_REPO}"

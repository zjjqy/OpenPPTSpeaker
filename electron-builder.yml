{
  "appId": "org.openpptspeaker.app",
  "productName": "OpenPPTSpeaker",
  "directories": {
    "output": "release"
  },
  "artifactName": "${productName}-${version}-setup.${ext}",
  "files": [
    "out/**/*",
    "assets/**/*",
    "resources/**/*",
    "package.json",
    "!node_modules/pdfjs-dist/**",
    "!node_modules/@napi-rs/**",
    "!node_modules/vue/**",
    "!node_modules/@vue/**",
    "!node_modules/@babel/**",
    "!node_modules/magic-string/**"
  ],
  "electronLanguages": ["en-US", "zh-CN"],
  "asarUnpack": [
    "node_modules/ffmpeg-static/**"
  ],
  "extraResources": [
    {
      "from": "introduceProduction",
      "to": "introduceProduction",
      "filter": ["**/*", "!**/*.bak*"]
    },
    {
      "from": "data/tts-cache",
      "to": "tts-cache-seed"
    }
  ],
  "win": {
    "target": ["nsis"],
    "icon": "assets/icon.ico"
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true
  }
}

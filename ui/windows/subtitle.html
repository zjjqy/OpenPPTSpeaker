<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>字幕条 · OpenPPTSpeaker UI</title>
<link rel="stylesheet" href="../assets/theme.css" />
<link rel="stylesheet" href="../assets/ui.css" />
<style>
  body { background: var(--vd-bg); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 22px 60px; display:grid;
    grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
  .side { padding: 20px; position: sticky; top: 76px; }
  .side h3 { font-size:15px; margin-bottom:4px; }
  .side .intro { font-size:12.5px; color: var(--vd-text-3); line-height:1.7; margin-bottom:14px; }
  .st-row { display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13px; }
  .st-row .lbl { width:62px; flex:none; color:var(--vd-text-2); }
  .st-row .range { flex:1; }
  .st-row .val { width:40px; text-align:right; font-family:var(--vd-font-mono); font-size:11px; color:var(--vd-text-3); }
  .st-row .switch { transform:scale(.8); transform-origin:left center; }
  .sec-gap { margin: 8px 0; border-top:1px solid var(--vd-line-2); padding-top:10px; }
  .sentence-rail { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .sitem { padding:7px 10px; border-radius:9px; font-size:12px; cursor:pointer; color:var(--vd-text-2);
    border:1px solid transparent; line-height:1.5; }
  .sitem:hover { background: var(--vd-surface-2); }
  .sitem.on { background: var(--vd-accent-soft); color:var(--vd-text-1); border-color:var(--vd-accent-ring); }
  .sitem .k { display:inline-flex; align-items:center; justify-content:center; width:17px;height:17px;
    margin-right:7px; border-radius:5px; background:var(--vd-surface); border:1px solid var(--vd-line);
    font-size:10px; font-weight:700; color:var(--vd-text-3); }
  .sitem.on .k { background:var(--vd-accent); border-color:var(--vd-accent); color:#fff; }

  /* 大屏预览 */
  .screen-frame { border-radius: 18px; overflow: hidden; border:1px solid var(--vd-line);
    box-shadow: var(--vd-shadow-lg); position:relative; background: var(--vd-surface); }
  .screen-top { display:flex; align-items:center; gap:10px; padding: 8px 12px; border-bottom:1px solid var(--vd-line-2);
    font-size:12px; color:var(--vd-text-2); }
  .win-dots { display:flex; gap:5px; } .win-dots i { width:9px; height:9px; border-radius:50%; background:var(--vd-line); }
  .win-dots i:nth-child(1){background:#f26d6d} .win-dots i:nth-child(2){background:#f0b44c} .win-dots i:nth-child(3){background:#57bb75}
  .screen-body { position: relative; height: 62vh; min-height: 420px; overflow:hidden; }
  /* 模拟被讲解的画面 */
  .scene { position:absolute; inset:0; }
  .scene .cap1 { position:absolute; left:4%; top:8%; font-weight:800; letter-spacing:-.01em; }
  .scene .cap2 { position:absolute; left:4%; top:16%; opacity:.85; font-weight:600; }
  .scene .blob { position:absolute; border-radius:24px; }
  .scene.video { background: linear-gradient(150deg,#0f1b2d, #16283f 55%, #0c1728); }
  .scene.video .cap1 { color:#eef4ff; font-size:30px; }
  .scene.video .cap2 { color:#8fa7c4; }
  .scene.video .blob { background: radial-gradient(circle at 35% 30%, #3b6fb0, #1d4a86 80%); opacity:.85; box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); }
  .scene.page { background: #ffffff; }
  .scene.page .cap1 { color:#1b2233; font-size:28px; }
  .scene.page .cap2 { color:#64718b; }
  .scene.page .blob { background: linear-gradient(145deg,#eef2f9,#dfe6f2); opacity:1; box-shadow: 0 18px 40px -18px rgba(20,30,60,.18); border:1px solid #e7ecf5;}
  .cap-tag { position:absolute; right:4%; top:8%; font-size:11px; font-weight:700; letter-spacing:.06em;
    padding:4px 10px; border-radius:999px; }
  .scene.video .cap-tag { color:#9db8dc; border:1px solid #2c4a72; }
  .scene.page .cap-tag { color:#8b97af; border:1px solid #e0e6f0; }

  /* 字幕条：透明窗口模拟 */
  .sub-shell { position:absolute; left:50%; transform: translateX(-50%); text-align:center;
    pointer-events:none; width: 86%; }
  .sub-meta { font-size: clamp(10px,1.1vh,13px); color:#fff; opacity:.9; letter-spacing:2px;
    text-shadow: 0 0 3px #000, 0 0 6px rgba(0,0,0,.9); margin-bottom: 5px; }
  .sub-box { display:inline-block; }
  .sub-text { color:#fff; font-weight:600; line-height:1.45; }
  .caret { display:inline-block; width:2px; margin-left:3px; background: var(--vd-accent);
    vertical-align:-2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }
  /* 描边层 */
  .st-txt { position:relative; z-index:0; }
  .st-txt::after { content:attr(data-t); position:absolute; left:0; top:0; z-index:-1; color:#000; }
  .stroke-on .st-txt { text-shadow:
    -2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000,0 2px 0 #000;
    -webkit-text-stroke: 1.5px rgba(0,0,0,.35); }
  .stroke-off .st-txt { text-shadow: 0 2px 10px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.8); }
</style>
</head>
<body>
<div class="toolbar-slot" data-page="字幕条"></div>

<div class="wrap">

  <!-- 左：说明与样式控制 -->
  <aside class="side card">
    <h3>字幕条</h3>
    <div class="intro">
      透明置顶的独立小窗，悬浮在「被讲解的画面」之上。讲解词按真实音频时长逐句推进，
      用户话语以深色区分。样式由讲稿统一下发，保证与编辑器、导出视频一致。
    </div>
    <div class="st-row"><span class="lbl">场景</span>
      <div class="seg" style="flex:1;">
        <button data-scene="video" class="on">深色画面</button>
        <button data-scene="page">浅色页面</button>
      </div>
    </div>
    <div class="sec-gap"></div>
    <div class="st-row"><span class="lbl">字号</span><input class="range" id="szR" type="range" min="20" max="60" value="34"><span class="val" id="szV">34px</span></div>
    <div class="st-row"><span class="lbl">距底</span><input class="range" id="btR" type="range" min="2" max="90" value="30"><span class="val" id="btV">30</span></div>
    <div class="st-row"><span class="lbl">进度角标</span><span class="switch"><input type="checkbox" id="swProg" checked><i></i></span></div>
    <div class="st-row"><span class="lbl">黑描边</span><span class="switch"><input type="checkbox" id="swStroke" checked><i></i></span></div>
    <div class="st-row"><span class="lbl">背景板</span><span class="switch"><input type="checkbox" id="swBg"><i></i></span></div>
    <div class="sec-gap"></div>
    <div style="font-size:11px;font-weight:700;color:var(--vd-text-3);letter-spacing:.06em;">句子推进（点击预览）</div>
    <div class="sentence-rail" id="sRail"></div>
  </aside>

  <!-- 右：预览大屏 -->
  <div class="screen-frame">
    <div class="screen-top">
      <span class="win-dots"><i></i><i></i><i></i></span>
      <span class="faint">正在被讲解的画面（模拟）：深色演示 / 浅色页面</span>
      <span class="spread"></span>
      <span class="chip acc">透明悬浮 · 置顶</span>
    </div>
    <div class="screen-body">
      <div class="scene video" id="scene">
        <div class="cap-tag">正在讲解 · 第 3 / 8 段</div>
        <div class="cap1">数字化转型实践分享</div>
        <div class="cap2">企业如何用数据驱动日常管理</div>
        <div class="blob" style="right:8%; bottom:12%; width:26%; height:38%;"></div>
        <div class="blob" style="left:12%; bottom:18%; width:18%; height:24%;"></div>
        <div class="blob" style="right:24%; top:22%; width:12%; height:16%;"></div>
      </div>

      <!-- 字幕条 -->
      <div class="sub-shell" id="subShell">
        <div class="sub-meta" id="subMeta">第 1 / 6 句 · 数字化转型实践分享</div>
        <div class="sub-box"><span class="sub-text" id="subText"></span><span class="caret" style="height:1em;"></span></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/app.js"></script>
<script>
  var SENTS = [
    '欢迎参加今天的分享，主题是企业数字化转型的落地实践。',
    '很多人以为数字化只是“上系统”，其实真正的关键是流程在线化。',
    '我们先把高频、重复的管理动作搬上线，形成统一的数据入口。',
    '数据一旦流动起来，管理就不再依赖个人经验，而是依赖事实。',
    '最后用一张驾驶舱，把分散在各部门的指标汇总到一块屏上。',
    '这就是今天分享的核心思路：业务在线、数据闭环、用数据说话。'
  ]
  var cur = 0
  var rail = document.getElementById('sRail')
  SENTS.forEach(function (s, i) {
    var d = document.createElement('div')
    d.className = 'sitem' + (i === 0 ? ' on' : '')
    d.innerHTML = '<span class="k">' + (i + 1) + '</span>' + s
    d.addEventListener('click', function () { sel(i) })
    rail.appendChild(d)
  })
  var txt = document.getElementById('subText')
  var meta = document.getElementById('subMeta')
  var subShell = document.getElementById('subShell')
  function sel(i) {
    cur = i
    txt.textContent = SENTS[i]
    meta.textContent = '第 ' + (i + 1) + ' / ' + SENTS.length + ' 句 · 数字化转型实践分享'
    ;[].forEach.call(rail.children, function (c, j) { c.classList.toggle('on', j === i) })
  }
  sel(0)

  // 场景切换
  ;[].forEach.call(document.querySelectorAll('[data-scene]'), function (b) {
    b.addEventListener('click', function () {
      ;[].forEach.call(document.querySelectorAll('[data-scene]'), function (x) { x.classList.remove('on') })
      b.classList.add('on')
      var scene = document.getElementById('scene')
      scene.className = 'scene ' + b.dataset.scene
    })
  })
  // 样式控制
  var szR = document.getElementById('szR'), btR = document.getElementById('btR')
  var szV = document.getElementById('szV'), btV = document.getElementById('btV')
  var strokeOn = true
  document.getElementById('swStroke').addEventListener('change', function () {
    strokeOn = this.checked
    subShell.classList.toggle('stroke-on', strokeOn)
    subShell.classList.toggle('stroke-off', !strokeOn)
  })
  document.getElementById('swProg').addEventListener('change', function () {
    document.getElementById('subMeta').style.display = this.checked ? '' : 'none'
  })
  document.getElementById('swBg').addEventListener('change', function () {
    var t = txt.parentElement
    t.style.background = this.checked ? 'rgba(0,0,0,.62)' : 'transparent'
    t.style.padding = this.checked ? '8px 18px' : '0'
    t.style.borderRadius = this.checked ? '12px' : '0'
  })
  szR.addEventListener('input', function () {
    var px = +szR.value
    szV.textContent = px + 'px'
    txt.style.fontSize = px + 'px'
    txt.style.lineHeight = (px * 1.45) + 'px'
  })
  btR.addEventListener('input', function () {
    btV.textContent = btR.value
    subShell.style.bottom = btR.value + 'px'
  })
  subShell.classList.add('stroke-on')
</script>
</body>
</html>
